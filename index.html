<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player Responsive</title>

    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 12px;
            background-color: #1f1f1f;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        /* Susunan Asal untuk Telefon (Mobile First) */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        .video-container {
            width: 100%;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .plyr {
            width: 100%;
            max-height: 40vh; /* Hadkan tinggi video di telefon supaya senarai terpaparkan */
        }

        .playlist-container {
            width: 100%;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .playlist-header {
            padding: 10px 15px;
            background-color: #222;
            font-weight: bold;
            border-bottom: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #121212;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #00b3ff;
        }

        .playlist {
            list-style: none;
            overflow-y: auto;
            max-height: 50vh; /* Membolehkan skrol untuk senarai di telefon */
        }

        .playlist li {
            padding: 12px 15px;
            border-bottom: 1px solid #282828;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .playlist li:hover {
            background-color: #2a2a2a;
        }

        .playlist li.active {
            background-color: #00b3ff;
            color: #000;
            font-weight: bold;
        }

        .loading {
            padding: 15px;
            text-align: center;
            color: #aaa;
        }

        /* Susunan Laluan Pintas untuk Skrin Lebar / PC (Desktop Layout) */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                height: calc(100vh - 45px);
            }

            .video-container {
                flex: 3;
                display: flex;
                align-items: center;
                justify-content: center;
                position: static;
            }

            .plyr {
                max-height: 100%;
            }

            .playlist-container {
                flex: 1;
                min-width: 300px;
                max-width: 400px;
                border-left: 1px solid #2a2a2a;
            }

            .playlist {
                max-height: none;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <header>IPTV Player Web</header>

    <div class="container">
        <!-- Pemain Video -->
        <div class="video-container">
            <video id="player" controls playsinline></video>
        </div>

        <!-- Senarai Playlist -->
        <div class="playlist-container">
            <div class="playlist-header">
                <span>Senarai Saluran</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari saluran (cth: Sabah VFM)...">
            </div>
            <ul id="playlist" class="playlist">
                <li class="loading">Sedang memuatkan senarai M3U...</li>
            </ul>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <!-- HLS.js untuk stream .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- dash.js untuk stream .mpd -->
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

    <script>
        const m3uUrl = "https://ziqryadam86-collab.github.io/Live/Live.m3u";
        const video = document.getElementById("player");
        const playlistUI = document.getElementById("playlist");
        const searchInput = document.getElementById("searchInput");
        
        let allChannels = [];
        let hlsPlayer = null;
        let dashPlayer = null;

        // Inisialisasi Plyr
        const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
        });

        // Fetch dan parse fail M3U
        async function fetchAndParseM3U() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error("Gagal mengambil fail M3U");
                const data = await response.text();
                
                allChannels = parseM3U(data);
                renderPlaylist(allChannels);
            } catch (error) {
                console.error(error);
                playlistUI.innerHTML = `<li class="loading" style="color:red;">Gagal memuatkan M3U. Semak sekatan CORS atau URL.</li>`;
            }
        }

        // Ekstrak data M3U
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const titleMatch = line.split(',');
                    currentChannel.name = titleMatch.length > 1 ? titleMatch.slice(1).join(',').trim() : "Saluran Tanpa Nama";
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            });

            return channels;
        }

        // Papar senarai ke UI
        function renderPlaylist(channels) {
            playlistUI.innerHTML = '';

            if (channels.length === 0) {
                playlistUI.innerHTML = `<li class="loading">Tiada saluran dijumpai.</li>`;
                return;
            }

            channels.forEach((channel) => {
                const li = document.createElement('li');
                li.textContent = channel.name;
                li.addEventListener('click', () => {
                    document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(channel.url);
                });
                playlistUI.appendChild(li);
            });
        }

        // Fungsi carian saluran
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredChannels = allChannels.filter(channel => 
                channel.name.toLowerCase().includes(searchTerm)
            );
            renderPlaylist(filteredChannels);
        });

        // Mainkan URL (HLS / DASH / Native)
        function playStream(url) {
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
            if (dashPlayer) {
                dashPlayer.reset();
                dashPlayer = null;
            }

            if (url.includes('.mpd')) {
                dashPlayer = dashjs.MediaPlayer().create();
                dashPlayer.initialize(video, url, true);
            } else if (url.includes('.m3u8') || Hls.isSupported()) {
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(video);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                video.src = url;
                video.play();
            }
        }

        fetchAndParseM3U();
    </script>
</body>
            </html>
