<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>

    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px;
            background-color: #1f1f1f;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        .video-container {
            flex: 2;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
        }

        .playlist-container {
            flex: 1;
            background-color: #181818;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            padding: 10px 15px;
            background-color: #222;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .playlist {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .playlist li {
            padding: 12px 15px;
            border-bottom: 1px solid #282828;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .playlist li:hover {
            background-color: #2a2a2a;
        }

        .playlist li.active {
            background-color: #00b3ff;
            color: #000;
            font-weight: bold;
        }

        .loading {
            padding: 15px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>IPTV Player Web</header>

    <div class="container">
        <!-- Pemain Video -->
        <div class="video-container">
            <video id="player" controls playsinline></video>
        </div>

        <!-- Senarai Playlist -->
        <div class="playlist-container">
            <div class="playlist-header">Senarai Saluran</div>
            <ul id="playlist" class="playlist">
                <li class="loading">Sedang memuatkan senarai M3U...</li>
            </ul>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <!-- HLS.js untuk mainkan stream .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- dash.js untuk mainkan stream .mpd -->
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

    <script>
        const m3uUrl = "https://ziqryadam86-collab.github.io/Live/Live.m3u";
        const video = document.getElementById("player");
        const playlistUI = document.getElementById("playlist");
        
        // Inisialisasi Plyr
        const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
        });

        let hlsPlayer = null;
        let dashPlayer = null;

        // Fungsi Load M3U
        async function fetchAndParseM3U() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error("Gagal mengambil fail M3U");
                const data = await response.text();
                
                const channels = parseM3U(data);
                renderPlaylist(channels);
            } catch (error) {
                console.error(error);
                playlistUI.innerHTML = `<li class="loading" style="color:red;">Gagal memuatkan M3U. Sila semak isu CORS atau pautan.</li>`;
            }
        }

        // Parse teks M3U
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // Ambil nama saluran selepas koma
                    const titleMatch = line.split(',');
                    currentChannel.name = titleMatch.length > 1 ? titleMatch.slice(1).join(',') : "Saluran Tanpa Nama";
                } else if (line && !line.startsWith('#')) {
                    // Line yang tidak bermula dengan # adalah URL stream
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            });

            return channels;
        }

        // Render senarai ke HTML
        function renderPlaylist(channels) {
            playlistUI.innerHTML = '';

            if (channels.length === 0) {
                playlistUI.innerHTML = `<li class="loading">Tiada saluran dijumpai.</li>`;
                return;
            }

            channels.forEach((channel, index) => {
                const li = document.createElement('li');
                li.textContent = channel.name;
                li.addEventListener('click', () => {
                    // Tanda item aktif
                    document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    
                    // Mainkan media
                    playStream(channel.url);
                });
                playlistUI.appendChild(li);
            });
        }

        // Mainkan URL (Sama ada m3u8 atau mpd)
        function playStream(url) {
            // Hentikan player sedia ada
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
            if (dashPlayer) {
                dashPlayer.reset();
                dashPlayer = null;
            }

            // Semak jenis stream
            if (url.includes('.mpd')) {
                // Gunakan Dash.js untuk .mpd
                dashPlayer = dashjs.MediaPlayer().create();
                dashPlayer.initialize(video, url, true);
            } else if (url.includes('.m3u8') || Hls.isSupported()) {
                // Gunakan Hls.js untuk .m3u8
                if (HLSjsIsSupported(url)) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(video);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Sokongan native Safari
                    video.src = url;
                    video.play();
                }
            } else {
                // Fallback untuk media biasa (MP4, dll)
                video.src = url;
                video.play();
            }
        }

        function HLSjsIsSupported(url) {
            return Hls.isSupported() && (url.includes('.m3u8') || !url.includes('.mpd'));
        }

        // Muat M3U semasa halaman siap dibuka
        fetchAndParseM3U();
    </script>
</body>
    </html>
